spring:
  application:
    name: inat-ead-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

api:
  security:
    jwt:
      secret: ${API_SECURITY_JWT_SECRET}
      issuer: ${API_SECURITY_JWT_ISSUER:inat-ead-backend}
    refresh-cookie:
      secure: ${API_SECURITY_REFRESH_COOKIE_SECURE:true}
