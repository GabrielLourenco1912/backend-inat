spring:
  datasource:
    url: jdbc:h2:mem:inat_ead_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: localhost
    port: 2525
    username: test@inat.local
    password: test-only

api:
  mail:
    from: test@inat.local
  academic:
    lifecycle:
      enabled: false
  document:
    lifecycle:
      enabled: false
  notification:
    email:
      enabled: false
  storage:
    filesystem:
      root: ${java.io.tmpdir}/inat-ead-test-files
      max-size: 1MB
  security:
    jwt:
      secret: test-only-secret-key-with-at-least-32-characters
      issuer: http://inat
    refresh-cookie:
      secure: false
    account-lock:
      scheduler-enabled: false
